<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f6f4"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="/static/manifest.json"><title>Research Podcast Factory</title><style>:root{--bg:#f6f6f4;--ink:#171717;--muted:#6b6b65;--line:#d8d8d2;--accent:#2b4cff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:760px;margin:auto;padding:32px 18px 60px}h1{font-size:clamp(38px,10vw,64px);line-height:.95;letter-spacing:-.055em;margin:10px 0 14px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin:16px 0}label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}input,textarea,select,button{font:inherit}input,textarea,select{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px}textarea{min-height:110px}.primary{width:100%;margin-top:16px;background:var(--accent);color:#fff;border:0;border-radius:12px;padding:14px;font-weight:750}.secondary{border:0;border-radius:10px;padding:9px 12px}.hidden{display:none}.job{padding:16px 0;border-top:1px solid var(--line)}.job:first-child{border-top:0}.status{display:inline-block;margin-top:8px;padding:4px 9px;border:1px solid var(--line);border-radius:999px;font-size:12px;font-weight:700;text-transform:uppercase}.muted{color:var(--muted)}.row{display:flex;gap:10px}.row>*{flex:1}.bar{height:5px;background:#e9e9e4;border-radius:99px;overflow:hidden;margin:10px 0}.bar span{display:block;height:100%;width:45%;background:var(--accent);animation:m 1.4s infinite}@keyframes m{from{transform:translateX(-110%)}to{transform:translateX(230%)}}</style></head><body><main><div class="muted">ROMAN'S HEADLESS RESEARCH PIPELINE</div><h1>Research Podcast Factory</h1><p class="muted">Submit a question from your phone. The server researches it, operates NotebookLM, waits durably, downloads the episode, and sends it to Spotify.</p><section id="auth" class="card"><h2>Connect this phone</h2><input id="token" type="password" placeholder="RPF API token"><button id="save" class="primary">Save token</button></section><section id="create" class="card hidden"><h2>New episode</h2><form id="form"><label>Topic</label><textarea id="topic" required placeholder="What should the system investigate?"></textarea><label>Direction, optional</label><textarea id="instructions" style="min-height:80px"></textarea><label>Sources, optional</label><input id="files" type="file" multiple><div class="row"><div><label>Audience</label><input id="audience" value="Roman, curious skeptical listener"></div><div><label>Sources</label><select id="max"><option>8</option><option selected>10</option><option>12</option><option>14</option></select></div></div><button class="primary">Generate podcast</button></form></section><section id="jobsCard" class="card hidden"><div class="row"><h2>Jobs</h2><button id="refresh" class="secondary">Refresh</button></div><div id="jobs"></div></section></main><script>const $=x=>document.getElementById(x),key='rpf-token';let token=localStorage.getItem(key)||'',timer;function esc(s=''){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function show(){const ok=!!token;$('auth').classList.toggle('hidden',ok);$('create').classList.toggle('hidden',!ok);$('jobsCard').classList.toggle('hidden',!ok);if(ok)load()}async function api(path,opt={}){opt.headers={...(opt.headers||{}),'X-RPF-Token':token};const r=await fetch(path,opt);const d=await r.json().catch(()=>({}));if(r.status===401){localStorage.removeItem(key);token='';show()}if(!r.ok)throw Error(d.detail||'Request failed');return d}function active(s){return !['complete','failed','cancelled','needs_google_auth','needs_spotify_auth'].includes(s)}function render(j){return `<article class="job"><strong>${esc(j.topic)}</strong><br><span class="status">${esc(j.status.replaceAll('_',' '))}</span><div class="muted">${esc((j.stage||'').replaceAll('_',' '))}, attempt ${j.attempts}</div>${active(j.status)?'<div class="bar"><span></span></div>':''}${j.error?`<details><summary>Error</summary><pre>${esc(j.error)}</pre></details>`:''}${j.notebook_url?`<p><a href="${esc(j.notebook_url)}">Open NotebookLM</a></p>`:''}${j.spotify_url?`<p><a href="${esc(j.spotify_url)}">Open Spotify</a></p>`:''}<button class="secondary" onclick="detailsJob('${j.id}')">Details</button> ${['failed','cancelled','needs_google_auth','needs_spotify_auth'].includes(j.status)?`<button class="secondary" onclick="retryJob('${j.id}')">Retry</button>`:''}<div id="d-${j.id}"></div></article>`}async function load(){try{const d=await api('/api/jobs');$('jobs').innerHTML=d.jobs.length?d.jobs.map(render).join(''):'<p>No jobs yet.</p>';clearTimeout(timer);timer=setTimeout(load,d.jobs.some(j=>active(j.status))?6000:20000)}catch(e){alert(e.message)}}async function detailsJob(id){const d=await api('/api/jobs/'+id);$('d-'+id).innerHTML='<details open><summary>Timeline</summary>'+d.events.map(e=>`<p><strong>${esc(e.stage)}</strong><br>${esc(e.message)}<br><span class="muted">${new Date(e.created_at).toLocaleString()}</span></p>`).join('')+'</details>'}async function retryJob(id){await api('/api/jobs/'+id+'/retry',{method:'POST'});load()}window.detailsJob=detailsJob;window.retryJob=retryJob;$('save').onclick=()=>{token=$('token').value.trim();localStorage.setItem(key,token);show()};$('refresh').onclick=load;$('form').onsubmit=async e=>{e.preventDefault();const f=new FormData();f.append('topic',$('topic').value);f.append('instructions',$('instructions').value);f.append('audience',$('audience').value);f.append('max_sources',$('max').value);for(const x of $('files').files)f.append('files',x);await api('/api/jobs',{method:'POST',body:f});$('topic').value='';$('instructions').value='';$('files').value='';load()};show();if('serviceWorker'in navigator)navigator.serviceWorker.register('/static/sw.js').catch(()=>{});</script></body></html>
